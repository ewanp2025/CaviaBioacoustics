name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Qt 6.7.2 for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtmultimedia qt5compat'
          cache: true

      - name: Build APK
        run: |
          mkdir -p build && cd build

          # Fix paths - Qt_ROOT_DIR points to android kit when target=android
          QT_ROOT="${{ github.workspace }}/Qt/6.7.2"
          QT_ANDROID_CMAKE="${QT_ROOT}/android_arm64_v8a/bin/qt-cmake"
          QT_HOST_PATH="${QT_ROOT}/gcc_64"

          echo "QT_ROOT          = ${QT_ROOT}"
          echo "QT_HOST_PATH     = ${QT_HOST_PATH}"
          echo "QT_ANDROID_CMAKE = ${QT_ANDROID_CMAKE}"
          ls -la "${QT_ANDROID_CMAKE}" || echo "qt-cmake not found!"

          ${QT_ANDROID_CMAKE} .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH=${QT_HOST_PATH} \
            -DCMAKE_PREFIX_PATH="${QT_ROOT}/android_arm64_v8a" \
            -DCMAKE_FIND_ROOT_PATH="${QT_ROOT}/android_arm64_v8a" \
            -DCMAKE_ANDROID_API=34 \
            -DQT_ANDROID_API_LEVEL=34 \
            -DQT_ANDROID_COMPILE_SDK_VERSION=34 \
            -DQT_ANDROID_TARGET_SDK_VERSION=34 \
            -DQT_ANDROID_MIN_SDK_VERSION=28 \
            -DQT_ANDROID_ABIS="arm64-v8a" \
            -DQT_ANDROID_BUILD_ALL_ABIS=OFF

          cmake --build . --config Release -j$(nproc)
          cmake --build . --target apk --config Release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CaviaBioacoustics-App
          path: |
            build/*.apk
            build/android-build/*.apk
            build/android-build/appCaviaBioacoustics.apk
          if-no-files-found: error

name: Build Android APK and AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Qt 6.7.2 for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtmultimedia qt5compat'
          cache: true
          dir: '${{ github.workspace }}/Qt'    

      - name: Debug Qt Installation
        run: |
          echo "=== Qt Debug ==="
          echo "QT_ROOT_DIR = $QT_ROOT_DIR"
          echo "QT_HOST_PATH = $QT_HOST_PATH"
          which qt-cmake || echo "qt-cmake not in PATH"
          ls -la /home/runner/work/CaviaBioacoustics/CaviaBioacoustics/Qt/6.7.2/android_arm64_v8a/bin/qt-cmake || echo "qt-cmake missing"
          ls -la /home/runner/work/CaviaBioacoustics/CaviaBioacoustics/Qt/6.7.2/gcc_64/bin/qt-cmake || echo "host qt-cmake missing"

      - name: Remove Incompatible Android SDKs
        run: |
          echo "Removing SDK 35 and 36 to force fallback to SDK 34..."
          rm -rf $ANDROID_HOME/platforms/android-35*
          rm -rf $ANDROID_HOME/platforms/android-36*

      - name: Build APK and AAB
        run: |
          mkdir -p build && cd build
          QT_ANDROID_CMAKE="${QT_ROOT_DIR}/bin/qt-cmake"

          echo "Using qt-cmake: $QT_ANDROID_CMAKE"

          # Change CMAKE_BUILD_TYPE to Debug
          "$QT_ANDROID_CMAKE" .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DANDROID_PLATFORM=android-34 \
            -DQT_ANDROID_ABIS="arm64-v8a;armeabi-v7a" \
            -DQT_ANDROID_BUILD_ALL_ABIS=ON

          cmake --build . --config Debug -j$(nproc)
          
          # Build the APK for direct phone testing
          cmake --build . --target apk --config Debug
          
          # Build the AAB for the Google Play Store
          cmake --build . --target aab --config Debug

      - name: Upload Android Builds
        uses: actions/upload-artifact@v4
        with:
          name: CaviaBioacoustics-Builds
          path: |
            build/**/*.apk
            build/**/*.aab
          if-no-files-found: error

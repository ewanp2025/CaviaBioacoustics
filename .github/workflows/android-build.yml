name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7.2' 
          target: 'android'
          arch: 'android_arm64_v8a'

      - name: Compile C++ to APK
        run: |
          mkdir build
          cd build
          # qt-cmake automatically handles all the horrible NDK/SDK paths for you
          qt-cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build .
          cmake --build . --target apk

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: CaviaBioacoustics-App
          path: build/**/*.apk

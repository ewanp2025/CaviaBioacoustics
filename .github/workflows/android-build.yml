name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7.2'
          target: 'android'
          arch: 'android_arm64_v8a'

      - name: Compile C++ to APK
        run: |
          mkdir build
          cd build
          
         
          QT_BIN_DIR=$(dirname $(which qt-cmake))
          QT_ANDROID_DIR=$(dirname $QT_BIN_DIR)
          QT_HOST_DIR=$(dirname $QT_ANDROID_DIR)/gcc_64
          
          echo "Detected Android Qt path: $QT_ANDROID_DIR"
          echo "Detected Host Qt path: $QT_HOST_DIR"
          
          qt-cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH=$QT_HOST_DIR \
            -DANDROID_SDK_ROOT=$ANDROID_HOME \
            -DANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME
            
          cmake --build .
          cmake --build . --target apk

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: CaviaBioacoustics-App
          path: build/**/*.apk

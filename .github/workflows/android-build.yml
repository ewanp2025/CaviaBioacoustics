name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Qt 6.7.2 (Host + Android)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtmultimedia qt5compat'
          cache: true
          dir: '${{ github.workspace }}/Qt'  

      - name: Build APK
        run: |
          mkdir -p build && cd build

          QT_BASE="${{ github.workspace }}/Qt/6.7.2"
          QT_ANDROID_CMAKE="${QT_BASE}/android_arm64_v8a/bin/qt-cmake"
          QT_HOST_PATH="${QT_BASE}/gcc_64"

          echo "=== Qt Paths ==="
          echo "QT_BASE          = $QT_BASE"
          echo "QT_HOST_PATH     = $QT_HOST_PATH"
          echo "QT_ANDROID_CMAKE = $QT_ANDROID_CMAKE"
          ls -la "$QT_ANDROID_CMAKE" || echo "ERROR: qt-cmake not found"

          "$QT_ANDROID_CMAKE" .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DCMAKE_PREFIX_PATH="${QT_BASE}/android_arm64_v8a" \
            -DCMAKE_ANDROID_API=34 \
            -DQT_ANDROID_API_LEVEL=34 \
            -DQT_ANDROID_COMPILE_SDK_VERSION=34 \
            -DQT_ANDROID_TARGET_SDK_VERSION=34 \
            -DQT_ANDROID_MIN_SDK_VERSION=28 \
            -DQT_ANDROID_ABIS="arm64-v8a"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CaviaBioacoustics-App
          path: |
            build/*.apk
            build/android-build/*.apk
            build/android-build/appCaviaBioacoustics.apk
          if-no-files-found: error

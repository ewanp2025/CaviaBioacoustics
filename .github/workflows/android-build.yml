name: Build Android APK and AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Qt 6.7.2 for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtmultimedia qt5compat'
          cache: true
          dir: '${{ github.workspace }}/Qt'    

      - name: Build Debug APK
        run: |
          mkdir -p build_debug && cd build_debug
          QT_ANDROID_CMAKE="${QT_ROOT_DIR}/bin/qt-cmake"
          
          "$QT_ANDROID_CMAKE" .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DANDROID_PLATFORM=android-35 \
            -DQT_ANDROID_ABIS="arm64-v8a;armeabi-v7a" \
            -DQT_ANDROID_BUILD_ALL_ABIS=ON

          cmake --build . --target apk --config Debug

      - name: Build Release AAB
        run: |
          mkdir -p build_release && cd build_release
          QT_ANDROID_CMAKE="${QT_ROOT_DIR}/bin/qt-cmake"
          
          "$QT_ANDROID_CMAKE" .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DANDROID_PLATFORM=android-35 \
            -DQT_ANDROID_ABIS="arm64-v8a;armeabi-v7a" \
            -DQT_ANDROID_BUILD_ALL_ABIS=ON

          cmake --build . --target aab --config Release

      - name: Sign Release AAB
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: build_release/android-build/
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CaviaBioacoustics-Debug-APK
          path: build_debug/**/*.apk

      - name: Upload Signed Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CaviaBioacoustics-Signed-Release-Builds
          path: build_release/**/*.aab
